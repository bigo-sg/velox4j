# GitLab CI/CD for bigo-sg/velox4j.
# Uses the same velox-deps Docker image as bigo-sg/velox CI, which has all
# C++ dependencies pre-installed as SYSTEM libraries in /usr/local.
#
# Prerequisite: the velox-deps image must be built and pushed:
#   docker build -t listar1111/velox-deps:ubuntu20 \
#     -f scripts/Dockerfile.ubuntu20 .   (in bigo-sg/velox repo)
#   docker push listar1111/velox-deps:ubuntu20

variables:
  CCACHE_DIR: "/data/build/ccache"
  CCACHE_MAXSIZE: "5G"
  DEBIAN_FRONTEND: "noninteractive"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

stages:
  - test

streaming-tests:
  tags:
    - velox
  image: listar1111/velox-deps:ubuntu20
  interruptible: true
  before_script:
    - export CC=/usr/bin/gcc-11
    - export CXX=/usr/bin/g++-11
  script:
    # 1. Build native + run Java streaming test (Maven calls build.sh internally).
    - mvn test -Dtest=StatefulStreamingTest -DfailIfNoTests=false -Dgpg.skip -Dspotless.skip=true

    # 2. C++ streaming test: reconfigure with testing ON, build only the test target.
    - >
      cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/usr/local
      -DBoost_DIR=/usr/local/lib/cmake/Boost-1.84.0
      -DVELOX4J_ENABLE_CCACHE=ON -DVELOX4J_BUILD_TESTING=ON
      -S src/main/cpp -B src/main/cpp/build
    - cmake --build src/main/cpp/build --target velox4j_stateful_streaming_test -j $(nproc)
    - src/main/cpp/build/test/velox4j_stateful_streaming_test
