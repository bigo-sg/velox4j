name: C++ UT

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"
  pull_request:
    types: [ opened, reopened, synchronize ]
    paths:
      - 'src/main/cpp/**'
      - '.github/workflows/ut-cpp.yml'
      - '.github/workflows/scripts/ut-cpp/**'

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  ut-ubuntu20:
    runs-on: ubuntu-latest
    env:
      HOST_CCACHE_DIR: "${{ github.workspace }}/.ccache"
    steps:
      - uses: actions/checkout@v4
      - name: Restore Ccache
        uses: actions/cache/restore@v4
        with:
          path: '${{ env.HOST_CCACHE_DIR }}'
          key: ut-cpp-ubuntu20-ccache
          restore-keys: |
            ut-cpp-ubuntu20-ccache
      - name: Run setup script / Build and run tests
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          docker run -v ${{ github.workspace }}:/velox4j -w /velox4j -e EVENT_NAME ubuntu:20.04 bash -c "
            export CCACHE_DIR=/velox4j/.ccache
            export CCACHE_MAXSIZE=3000M
            bash .github/workflows/scripts/ut-cpp/setup-ubuntu20.sh
            if [ \"\$EVENT_NAME\" = \"pull_request\" ]; then
              bash src/main/cpp/test-streaming.sh
            else
              bash src/main/cpp/test.sh
            fi
          "
      - name: Save Ccache
        uses: actions/cache/save@v4
        with:
          path: '${{ env.HOST_CCACHE_DIR }}'
          key: ut-cpp-ubuntu20-ccache
