name: UT

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"
  pull_request:
    types: [ opened, reopened, synchronize ]
    paths:
      - '**/*'
  push:
    branches:
      - 'main'
    paths:
      - '**/*'

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  ut-ubuntu20:
    runs-on: ubuntu-latest
    env:
      HOST_CCACHE_DIR: "${{ github.workspace }}/.ccache"
    steps:
      - uses: actions/checkout@v4
      - name: Restore Ccache
        uses: actions/cache/restore@v4
        with:
          path: '${{ env.HOST_CCACHE_DIR }}'
          key: ut-ubuntu20-ccache
          restore-keys: |
            ut-ubuntu20-ccache
      - name: Setup / Build native / Run streaming tests
        run: |
          docker run -v ${{ github.workspace }}:/velox4j -w /velox4j ubuntu:20.04 bash -c '
            export CCACHE_DIR=/velox4j/.ccache
            export CCACHE_MAXSIZE=3000M
            export DEBIAN_FRONTEND=noninteractive

            # 1. Install build dependencies.
            bash .github/workflows/scripts/ut-java/setup-ubuntu20.sh

            # 2. Build native + run Java streaming test (Maven calls build.sh internally).
            mvn test -Dtest=StatefulStreamingTest -DfailIfNoTests=false

            # 3. C++ streaming test: reconfigure with testing ON, build only the test target.
            cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/usr/local \
              -DBoost_DIR=/usr/local/lib/cmake/Boost-1.84.0 \
              -DVELOX4J_ENABLE_CCACHE=ON -DVELOX4J_BUILD_TESTING=ON \
              -S src/main/cpp -B src/main/cpp/build
            cmake --build src/main/cpp/build --target velox4j_stateful_streaming_test -j $(nproc)
            src/main/cpp/build/test/velox4j_stateful_streaming_test
          '
      - name: Save Ccache
        uses: actions/cache/save@v4
        with:
          path: '${{ env.HOST_CCACHE_DIR }}'
          key: ut-ubuntu20-ccache
